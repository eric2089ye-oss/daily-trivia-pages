name: Daily build

# songless 模式完整版（2026-10-25）：拉 KV（数据+种子+代码）→ 全量重建 →
# 数据新鲜度门禁 → 部署 Pages → 线上验收。影子期 PAGES_PROJECT=h4t-shadow，
# 切换后改为生产项目。公开仓零数据零代码。

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [data-updated]
  schedule:
    # Backstop after the collector's 04:05-05:50 UTC retry ladder.
    - cron: '35 5 * * *'

concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE: ${{ secrets.KV_NAMESPACE }}
      KV_TOKEN: ${{ secrets.KV_TOKEN }}
      PAGES_PROJECT: ${{ secrets.PAGES_PROJECT }}
      SITE_HOST: ${{ secrets.SITE_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull data, seed and build code from Cloudflare KV
        run: |
          mkdir -p data
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE/values"
          curl -sS --fail --max-time 120 \
            -H "Authorization: Bearer $KV_TOKEN" \
            "$BASE/data/dives-all" -o data/dives-all.json
          echo "pulled dives-all.json ($(wc -c < data/dives-all.json) bytes)"
          curl -sS --fail --max-time 120 \
            -H "Authorization: Bearer $KV_TOKEN" \
            "$BASE/data/site-seed.tar.gz" -o data/site-seed.tar.gz
          echo "pulled site-seed.tar.gz ($(wc -c < data/site-seed.tar.gz) bytes)"
          curl -sS --fail --max-time 60 \
            -H "Authorization: Bearer $KV_TOKEN" \
            "$BASE/data/site-practice.tar.gz" -o data/site-practice.tar.gz
          echo "pulled site-practice.tar.gz ($(wc -c < data/site-practice.tar.gz) bytes)"
          curl -sS --fail --max-time 120 \
            -H "Authorization: Bearer $KV_TOKEN" \
            "$BASE/code/pkg.tar.gz" -o code.tar.gz
          echo "pulled code.tar.gz ($(wc -c < code.tar.gz) bytes)"

      - name: Data integrity gate
        run: |
          python3 - <<'EOF'
          import json, datetime
          d = json.load(open('data/dives-all.json'))
          dives = d['dives']
          dates = [x['diso'] for x in dives]
          assert len(dives) == d['latest_n'], f"count {len(dives)} != latest_n {d['latest_n']}"
          assert len(set(dates)) == len(dates), "duplicate dates"
          for x in dives:
              assert len(x['prompts']) == 7, x['diso']
              assert len(x['pools']) == 7, x['diso']
          now = datetime.datetime.utcnow()
          expect_min = (now - datetime.timedelta(days=1)).strftime('%Y-%m-%d')
          if now.hour < 4:
              expect_min = (now - datetime.timedelta(days=2)).strftime('%Y-%m-%d')
          latest = max(dates)
          print(f"integrity OK: {len(dives)} dives, latest {latest}")
          if latest < expect_min:
              raise SystemExit(f"STALE: latest {latest} < {expect_min}")
          print("freshness OK (>= %s)" % expect_min)
          EOF

      - name: Rebuild retained pages (patch mode, no new pages)
        run: |
          tar xzf data/site-seed.tar.gz
          tar xzf data/site-practice.tar.gz
          tar xzf code.tar.gz
          pip install -q curl_cffi
          python3 scripts/build_daily.py
          # build_daily 内置守恒断言：63 页不变 + sitemap URL 集不变（DSH 2026-10-24 规则）

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: npx -y wrangler pages deploy site --project-name "$PAGES_PROJECT" --branch main

      - name: Live verification
        run: |
          sleep 20
          LATEST=$(python3 -c "import json; d=json.load(open('data/dives-all.json')); print(d['latest_n'])")
          HOST="$PAGES_PROJECT.pages.dev"
          TITLE=$(curl -s --max-time 30 "https://$HOST/" | grep -o '<title>[^<]*</title>' | head -1)
          echo "Live title: $TITLE (expect #$LATEST)"
          if ! echo "$TITLE" | grep -q "#$LATEST"; then
            echo "VERIFICATION FAILED: title does not carry #$LATEST"
            exit 1
          fi
          # 保留页抽查（63 URL 冻结集）
          for u in /krillion-hints/ /rare-krillion-answers/ /krillion-archive/october-2026/ /faq/; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "https://$HOST$u")
            echo "kept page $u → $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
          echo "Live site verified on $HOST"

      - name: IndexNow ping (production host, retained pages)
        run: |
          KEY_FILE=$(cd site && ls | grep -E '^[a-f0-9]{32}\.txt$' | head -1 || true)
          if [ -n "$KEY_FILE" ]; then
            KEY="${KEY_FILE%.txt}"
            curl -sS -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json" \
              --data "{\"host\":\"$SITE_HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$SITE_HOST/$KEY.txt\",\"urlList\":[\"https://$SITE_HOST/\",\"https://$SITE_HOST/yesterday/\",\"https://$SITE_HOST/krillion-hints/\",\"https://$SITE_HOST/krillion-archive/\"]}" || true
            echo "IndexNow pinged"
          else
            echo "no IndexNow key file in build output"
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build report"
            echo "- Finished: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Pages built: $(find site -name '*.html' | wc -l)"
            echo "- Project: $PAGES_PROJECT"
          } >> "$GITHUB_STEP_SUMMARY"
